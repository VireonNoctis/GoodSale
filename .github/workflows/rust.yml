name: Rust API

on:
  push:
    branches: [main, premium-marketplace-rework]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Format Rust sources
        if: github.event_name == 'push' && github.ref_name == 'premium-marketplace-rework'
        working-directory: backend
        run: cargo fmt --all

      - name: Commit rustfmt changes on the fork branch
        if: github.event_name == 'push' && github.ref_name == 'premium-marketplace-rework'
        run: |
          if [ -n "$(git status --porcelain backend/src)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/src
            git commit -m "chore: format Rust backend"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify formatting
        if: github.event_name != 'push' || github.ref_name != 'premium-marketplace-rework'
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: backend
        run: cargo test --all-targets

      - name: Release build
        working-directory: backend
        run: cargo build --release
